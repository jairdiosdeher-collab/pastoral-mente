<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b3f"><meta name="description" content="PastoralMente Enterprise, acompañamiento clínico-pastoral asistido por herramientas digitales"><title>PastoralMente Enterprise</title>
<style>
:root{--navy:#102b3f;--navy2:#183e53;--teal:#16877f;--mint:#e5f5f1;--bg:#f3f6f9;--ink:#1d2935;--muted:#687887;--line:#dfe7ed;--red:#b8323c;--amber:#a8650b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;background:var(--navy);color:white;padding:20px 13px;overflow:auto;z-index:5}.brand{display:flex;gap:10px;align-items:center;padding:0 8px 20px;border-bottom:1px solid #ffffff22}.logo{width:40px;height:40px;border-radius:12px;background:#dff5ee;color:var(--navy);display:grid;place-items:center;font-weight:900;font-size:18px}.brand strong{display:block}.brand small{color:#a9c2d0}.nav-label{font-size:10px;letter-spacing:1.4px;color:#91aebd;margin:20px 10px 6px}.nav button{width:100%;border:0;background:transparent;color:#c7d7e0;text-align:left;padding:9px 10px;border-radius:8px;margin:2px 0}.nav button:hover,.nav button.active{background:#ffffff1c;color:#fff}.main{margin-left:248px;min-height:100vh}.topbar{height:68px;background:#fffffff2;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:3}.crumb,.hint{color:var(--muted);font-size:11px}.top-title{font-weight:750}.user{display:flex;gap:10px;align-items:center}.avatar{width:34px;height:34px;border-radius:50%;background:var(--mint);color:var(--teal);display:grid;place-items:center;font-weight:800}.content{max-width:1450px;margin:auto;padding:26px 28px 45px}.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.eyebrow{color:var(--teal);font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase}.h1{font-size:27px;letter-spacing:-.6px;margin:4px 0}.sub{color:var(--muted);max-width:780px}.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 13px;font-weight:650;color:var(--ink)}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn.small{padding:5px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:17px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:0 7px 25px #102b3f08;min-width:0}.stat-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.stat-icon,.module-icon{background:var(--mint);color:var(--teal);width:36px;height:36px;border-radius:10px;display:grid;place-items:center}.stat-number{font-size:28px;font-weight:800;margin:8px 0 0}.cols{grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr)}.module-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section-head h2,.card h2{font-size:16px;margin:0}.section-head p{color:var(--muted);font-size:12px;margin:3px 0}.module-card{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink)}.module-card:hover{border-color:#83c6ba}.module-card strong{display:block;margin:1px 0 4px}.module-card small{color:var(--muted);line-height:1.4;display:block}.notice{border:1px solid #e8d7ac;background:#fff8e8;color:#73551c;padding:11px 13px;border-radius:10px;font-size:12px;margin-bottom:15px}.notice.blue{background:#eef7fb;border-color:#d1e8f1;color:#31596a}.notice.red{background:#fff0f1;border-color:#f2c8cb;color:#872d35}.pipeline{display:grid;grid-template-columns:repeat(9,minmax(100px,1fr));gap:7px;overflow:auto}.stage{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;min-width:100px}.stage b{display:block;font-size:11px}.stage small{font-size:10px;color:var(--muted)}.stage.current{border:2px solid var(--teal);padding:9px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#465563}.field input,.field select,.field textarea{border:1px solid #d6e0e6;background:white;border-radius:8px;padding:10px;width:100%;color:var(--ink)}.field textarea{min-height:85px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #16877f30;border-color:var(--teal)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.badge{display:inline-block;border-radius:20px;padding:4px 8px;font-size:10px;font-weight:750;background:#edf1f4;color:#51616e}.badge.green{background:#e3f5ee;color:#177b61}.badge.amber{background:#fff1d9;color:#99600a}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;color:var(--muted);background:#f8fafb}td,th{padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}.empty{text-align:center;padding:24px;color:var(--muted)}.bar-row{display:grid;grid-template-columns:105px 1fr 28px;align-items:center;gap:8px;margin:12px 0;font-size:12px}.bar{height:8px;border-radius:8px;background:#e9eff2;overflow:hidden}.bar span{display:block;height:100%;background:var(--teal)}.pill-row{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 9px;background:#f1f6f7;border-radius:8px;font-size:12px}.timeline{border-left:2px solid #dce8e9;padding-left:18px;margin-left:8px}.event{position:relative;padding-bottom:16px}.event:before{content:"";position:absolute;left:-24px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--teal)}.footer-note{font-size:11px;color:var(--muted);margin-top:14px}.auth-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#102b3f,#1c5c66);padding:20px}.auth-card{background:white;border-radius:17px;padding:26px;max-width:420px;width:100%}.auth-card h1{margin:0 0 6px}.auth-card p{color:var(--muted)}.auth-brand{display:flex;gap:12px;align-items:center;margin-bottom:20px}.mobile-menu{display:none}.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:white;padding:12px 16px;border-radius:9px;z-index:20}.hidden{display:none!important}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.module-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.sidebar{transform:translateX(-100%);transition:transform .2s;width:265px}.sidebar.open{transform:translateX(0)}.main{margin:0}.topbar{padding:0 13px}.content{padding:19px 13px}.h1{font-size:23px}.welcome{flex-direction:column}.module-grid,.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.mobile-menu{display:inline-block}.user .user-details{display:none}}
</style></head><body><div id="root"></div>
<script>
/* PastoralMente Enterprise — archivo único para GitHub Pages/Vercel.
   No usa localStorage para información clínica. Sin Firebase configurado, los datos son temporales en memoria. */
const PIPELINE=['Admisión','Consentimiento','Psicometría','Formulación clínica','Diagnóstico diferencial','Tratamiento','Seguimiento','Alta','Post-alta'];
const MODULES=[['dashboard','Dashboard ejecutivo','Actividad general y seguimiento','▦'],['admission','Admisión y triaje','Registro inicial y motivo de consulta','＋'],['consent','Consentimiento informado','Información y decisión documentada','✓'],['signature','Firma digital','Registro de aceptación electrónica','✎'],['psychometry','Psicometría · PHQ-9 · GAD-7','Cuestionarios y puntuación orientativa','◉'],['scale','Escala espiritual','Bienestar, sentido y recursos espirituales','✧'],['formulation','Motor clínico 5P','Formulación clínica estructurada','◎'],['differential','DSM-5-TR diferencial','Apoyo para hipótesis diferenciales','⌕'],['copilot','Copiloto terapéutico IA','Preparación de sesiones y tareas','✦'],['timeline','Línea de tiempo clínica','Eventos y notas de seguimiento','↗'],['agenda','Agenda clínica','Citas y estado de atención','▣'],['portal','Portal del paciente','Check-in, pensamientos y tareas','♡'],['library','Biblioteca terapéutica','Recursos psicoeducativos','▤'],['crisis','Plan de seguridad en crisis','Plan individual con apoyo profesional','盾'],['grief','Terapia de duelo · Worden','Tareas generales de elaboración del duelo','❋'],['couples','Pareja · Gottman','Ejercicios de comunicación','⌂'],['cognitive','Reestructuración cognitiva','Situación, pensamiento y alternativa','◈'],['reports','Generador de informes','Borradores para revisión profesional','▧'],['audit','Auditoría clínica','Trazabilidad de actividad','≡'],['discharge','Motor de alta','Lista de preparación para el alta','↗'],['postdischarge','Seguimiento post-alta','Continuidad y contactos','⟳'],['analytics','Analítica clínica','Indicadores descriptivos','▥'],['admin','Configuración administrativa','Roles, Firebase y seguridad','⚙']];
const S={user:null,role:'',page:'dashboard',menu:false,patients:[],appointments:[],events:[],fb:null,fbReady:false};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=d=>new Date(d).toLocaleDateString('es-CO',{year:'numeric',month:'short',day:'numeric'});function toast(t){let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.append(n);setTimeout(()=>n.remove(),3200)}function log(action,detail=''){S.events.unshift({at:new Date().toISOString(),actor:S.user?.email||'Sesión local',action,detail});if(S.events.length>300)S.events.length=300}
function firebaseConfig(){return window.PASTORALMENTE_FIREBASE_CONFIG||null}async function initFirebase(){const c=firebaseConfig();if(!c?.apiKey||!c?.projectId)return;try{const a=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),u=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'),d=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js'),st=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-storage.js');const app=a.initializeApp(c),auth=u.getAuth(app),db=d.getFirestore(app),storage=st.getStorage(app);S.fb={...u,...d,...st,auth,db,storage};S.fbReady=true;u.onAuthStateChanged(auth,async user=>{if(!user){S.user=null;render();return}S.user={uid:user.uid,email:user.email,verified:user.emailVerified};try{const snap=await d.getDoc(d.doc(db,'users',user.uid));S.role=snap.exists()?snap.data().role:'';if(!['administrador','supervisor','psicologo','consejero','paciente'].includes(S.role)){await u.signOut(auth);S.user=null;toast('Cuenta sin rol autorizado. Contacta al administrador.');render();return}await loadCloud();render()}catch(e){console.error(e);toast('No se pudo validar el rol o cargar datos. Revisa reglas de Firebase.')}})}catch(e){console.error(e);toast('Firebase no pudo inicializarse; revisa la configuración.')}}async function loadCloud(){if(!S.fb||!S.user)return;try{const d=S.fb,staff=['administrador','supervisor','psicologo','consejero'].includes(S.role);const q=staff?d.query(d.collection(d.db,'patients'),d.orderBy('updatedAt','desc'),d.limit(100)):d.query(d.collection(d.db,'patients'),d.where('patientUid','==',S.user.uid),d.limit(50));const snap=await d.getDocs(q);S.patients=snap.docs.map(x=>({id:x.id,...x.data()}));if(staff){const as=await d.getDocs(d.query(d.collection(d.db,'appointments'),d.orderBy('startAt','desc'),d.limit(100)));S.appointments=as.docs.map(x=>({id:x.id,...x.data()}))}}catch(e){console.error(e);toast('Lectura denegada o fallida. Revisa reglas y permisos.')}}
function nav(){let h='';const groups=[['PRINCIPAL',['dashboard','admission','agenda','portal']],['EVALUACIÓN CLÍNICA',['consent','signature','psychometry','scale','formulation','differential','timeline']],['INTERVENCIÓN',['copilot','library','crisis','grief','couples','cognitive']],['CONTINUIDAD',['reports','discharge','postdischarge','analytics']],['ADMINISTRACIÓN',['audit','admin']]];for(const [g,ids]of groups){h+=`<div class="nav-label">${g}</div>`;for(const id of ids){const m=MODULES.find(x=>x[0]===id);h+=`<button data-page="${id}" class="${S.page===id?'active':''}">${m[3]}　${m[1]}</button>`}}return h}function shell(content){let m=MODULES.find(x=>x[0]===S.page)||MODULES[0];return `<aside class="sidebar ${S.menu?'open':''}" id="sidebar"><div class="brand"><div class="logo">PM</div><div><strong>PastoralMente</strong><small>ENTERPRISE</small></div></div><nav class="nav">${nav()}</nav><div class="footer-note" style="color:#a9c2d0;padding:12px">Plataforma clínica-pastoral · Archivo único</div></aside><main class="main"><header class="topbar"><div style="display:flex;gap:12px;align-items:center"><button class="btn mobile-menu" id="menuBtn">☰</button><div><div class="crumb">PastoralMente / ${esc(m[1])}</div><div class="top-title">${esc(m[1])}</div></div></div><div class="user"><div class="avatar">${esc((S.user?.email||'U')[0].toUpperCase())}</div><div class="user-details"><strong>${esc(S.user?.email||'Usuario')}</strong><div class="hint">${esc(S.role)}</div></div><button class="btn small" id="logout">Salir</button></div></header><section class="content">${content}</section></main>`}function stat(l,v,n,i){return `<div class="card"><div class="stat-head"><span>${l}</span><span class="stat-icon">${i}</span></div><div class="stat-number">${v}</div><div class="hint">${n}</div></div>`}function moduleCard(m){return `<button class="module-card" data-page="${m[0]}"><span class="module-icon">${m[3]}</span><span><strong>${m[1]}</strong><small>${m[2]}</small></span></button>`}function dashboard(){let active=S.patients.filter(p=>p.status!=='Finalizado').length,done=S.patients.length-active;return `<div class="welcome"><div><div class="eyebrow">Centro de acompañamiento integral</div><h1 class="h1">Buen día, bienvenido.</h1><div class="sub">Organiza la atención, documenta el avance y da seguimiento a cada etapa del proceso.</div></div><button class="btn primary" data-page="admission">＋ Nuevo expediente</button></div><div class="notice ${S.fbReady?'blue':''}"><strong>Estado:</strong> ${S.fbReady?'Firebase inicializado. Verifica permisos y reglas antes de usar datos reales.':'Firebase no configurado: los datos ingresados se mantienen solo en memoria y se pierden al recargar.'} No sustituye juicio profesional ni gestiona emergencias.</div><div class="grid stats">${stat('Expedientes visibles',S.patients.length,'Acceso según rol','♙')}${stat('Casos activos',active,'Requieren seguimiento','◉')}${stat('Casos finalizados',done,'Marcados finalizados','✓')}${stat('Citas registradas',S.appointments.length,'Según permisos','▣')}</div><div class="card" style="margin-bottom:16px"><div class="section-head"><div><h2>Pipeline clínico de 9 etapas</h2><p>El progreso debe verificarse y registrarse en cada expediente.</p></div><span class="badge">9 etapas</span></div><div class="pipeline">${PIPELINE.map((x,i)=>`<div class="stage ${i===0?'current':''}"><b>${i+1}. ${x}</b><small>${i===0?'Entrada':'Pendiente de registro'}</small></div>`).join('')}</div></div><div class="grid cols"><div class="card"><div class="section-head"><div><h2>Expedientes recientes</h2><p>Solo registros visibles para tu rol.</p></div><button class="btn small" data-page="admission">Crear</button></div>${S.patients.length?`<div class="table-wrap"><table><thead><tr><th>Expediente</th><th>Etapa</th><th>Estado</th></tr></thead><tbody>${S.patients.slice(0,8).map(p=>`<tr><td><strong>${esc(p.name||'Paciente')}</strong><div class="hint">${esc(p.id)}</div></td><td>${esc(p.stage||'Admisión')}</td><td><span class="badge">${esc(p.status||'Activo')}</span></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No hay expedientes disponibles.</div>'}</div><div class="card"><h2>Indicadores de proceso</h2>${[['Admisión',S.patients.length],['Activos',active],['Finalizados',done],['Citas',S.appointments.length]].map(([l,n])=>`<div class="bar-row"><span>${l}</span><div class="bar"><span style="width:${Math.min(100,n*10)}%"></span></div><b>${n}</b></div>`).join('')}<div class="footer-note">Indicadores descriptivos, no diagnósticos.</div></div></div><div class="grid module-grid" style="margin-top:16px">${MODULES.filter(m=>['psychometry','formulation','differential','copilot','crisis','reports'].includes(m[0])).map(moduleCard).join('')}</div>`}
function formPage(title,desc,fields,button='Guardar borrador',warning=''){return `<div class="welcome"><div><div class="eyebrow">Registro clínico</div><h1 class="h1">${title}</h1><div class="sub">${desc}</div></div></div>${warning?`<div class="notice">${warning}</div>`:''}<div class="card"><form id="recordForm" class="form-grid" data-kind="${S.page}">${fields.map(f=>`<div class="field ${f.full?'full':''}"><label>${f.label}</label>${f.type==='textarea'?`<textarea name="${f.name}" ${f.req?'required':''} maxlength="${f.max||3000}" placeholder="${f.placeholder||''}"></textarea>`:f.type==='select'?`<select name="${f.name}" ${f.req?'required':''}>${f.options.map(x=>`<option>${x}</option>`).join('')}</select>`:f.type==='check'?`<label style="font-weight:500"><input type="checkbox" name="${f.name}" ${f.req?'required':''} style="width:auto"> ${f.placeholder}</label>`:`<input name="${f.name}" type="${f.type||'text'}" ${f.req?'required':''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.max!==undefined?`max="${f.max}"`:''} placeholder="${f.placeholder||''}">`}</div>`).join('')}<div class="field full"><div class="actions"><button class="btn primary">${button}</button><button type="reset" class="btn">Limpiar</button></div></div></form><div id="result"></div></div>`}
function admission(){return formPage('Admisión y triaje','Registra los datos mínimos necesarios y evita información no pertinente.',[{label:'Nombre del paciente *',name:'name',req:true},{label:'Edad',name:'age',type:'number',min:0,max:120},{label:'Contacto autorizado',name:'contact'},{label:'Motivo principal *',name:'reason',type:'select',req:true,options:['Seleccionar…','Ansiedad o estrés','Duelo o pérdida','Relaciones familiares o de pareja','Malestar emocional','Acompañamiento espiritual','Otro motivo']},{label:'Prioridad inicial',name:'priority',type:'select',options:['Pendiente de valoración','Rutina','Prioritaria','Requiere evaluación urgente']},{label:'Notas iniciales pertinentes',name:'notes',type:'textarea',full:true},{label:'Autorización para registrar los datos',name:'authorized',type:'check',req:true,placeholder:'Confirmo que estoy autorizado para registrar estos datos y explicaré el tratamiento de información.'}],'Guardar admisión','Este formulario no evalúa ni descarta emergencias. Ante peligro inmediato, busca atención presencial urgente y contacta los servicios de emergencia locales.')}function psychometry(){return `<div class="welcome"><div><div class="eyebrow">Evaluación · Cuestionarios</div><h1 class="h1">PHQ-9 y GAD-7</h1><div class="sub">Herramientas de cribado y seguimiento. Una puntuación por sí sola no establece diagnóstico.</div></div></div><div class="notice red">Si el ítem 9 del PHQ-9 tiene respuesta distinta de “Nunca”, requiere revisión clínica directa y evaluación de seguridad. Este formulario no reemplaza un protocolo de crisis.</div><div class="grid cols">${scaleForm('PHQ-9',['Poco interés o placer en hacer cosas','Sentirse decaído/a, deprimido/a o sin esperanza','Dificultad para dormir o dormir demasiado','Sentirse cansado/a o con poca energía','Poco apetito o comer en exceso','Sentirse mal consigo mismo/a','Dificultad para concentrarse','Moverse o hablar lentamente, o estar inquieto/a','Pensamientos de que estaría mejor muerto/a o de hacerse daño'],27)}${scaleForm('GAD-7',['Sentirse nervioso/a, ansioso/a o muy alterado/a','No poder dejar de preocuparse','Preocuparse demasiado por diferentes cosas','Dificultad para relajarse','Estar tan inquieto/a que cuesta permanecer quieto/a','Molestarse o irritarse fácilmente','Sentir miedo como si algo terrible pudiera pasar'],21)}</div>`}function scaleForm(title,qs,max){let id=title.toLowerCase().replace('-','');return `<div class="card"><h2>${title}</h2><p class="hint">Durante las últimas dos semanas, ¿con qué frecuencia le han molestado estos problemas?</p><form class="scaleForm" data-scale="${title}">${qs.map((q,i)=>`<div class="field" style="margin:11px 0"><label>${i+1}. ${q}</label><select name="q${i+1}" required><option value="">Seleccionar…</option><option value="0">Nunca (0)</option><option value="1">Varios días (1)</option><option value="2">Más de la mitad de los días (2)</option><option value="3">Casi todos los días (3)</option></select></div>`).join('')}<button class="btn primary">Calcular ${title}</button></form><div id="result-${id}"></div></div>`}
function content(){switch(S.page){case'dashboard':return dashboard();case'admission':return admission();case'consent':return formPage('Consentimiento informado','Documenta la información entregada y la decisión de la persona.',[{label:'Paciente / identificador *',name:'patient',req:true},{label:'Tipo de atención',name:'kind',type:'select',options:['Acompañamiento pastoral','Orientación psicológica','Atención psicológica clínica','Teleorientación']},{label:'Información explicada *',name:'explained',type:'textarea',full:true,req:true},{label:'Límites de confidencialidad explicados',name:'limits',type:'check',req:true,placeholder:'Confirmo que se explicaron alcance, límites y tratamiento de datos.'},{label:'Decisión',name:'decision',type:'select',options:['Acepta','No acepta','Solicita más información']}]);case'signature':return formPage('Firma digital','Registro de aceptación electrónica; no equivale a una firma digital certificada.',[{label:'Paciente / identificador *',name:'patient',req:true},{label:'Documento *',name:'document',req:true},{label:'Nombre escrito como aceptación *',name:'signedName',req:true},{label:'Fecha y hora declarada *',name:'signedAt',type:'datetime-local',req:true},{label:'Declaración de aceptación',name:'declaration',type:'check',req:true,placeholder:'Declaro que he leído y acepto el documento.'}],'Registrar aceptación','La validez legal depende del contexto, identidad, integridad y normativa aplicable.');case'psychometry':return psychometry();case'scale':return formPage('Escala de bienestar espiritual','Exploración voluntaria; no es una escala psicométrica validada.',[{label:'Paciente / identificador',name:'patient'},{label:'Sentido y propósito (0–10)',name:'meaning',type:'number',min:0,max:10},{label:'Conexión y apoyo (0–10)',name:'connection',type:'number',min:0,max:10},{label:'Paz interior (0–10)',name:'peace',type:'number',min:0,max:10},{label:'Recursos elegidos por la persona',name:'resources',type:'textarea',full:true},{label:'Necesida ,type:'textarea',full:true},{label:'Evidencia que matiza',name:'against',type:'textarea',full:true},{label:'Alternativa equilibrada',name:'alternative',type:'textarea',full:true},{label:'Acción útil',name:'action',type:'textarea',full:true}]);case'reports':return formPage('Generador de informes','Borrador textual para revisión profesional; no firma ni certifica.',[{label:'Paciente / identificador',name:'patient'},{label:'Tipo de informe',name:'type',type:'select',options:['Resumen de sesión','Informe de evolución','Plan de intervención','Resumen de alta']},{label:'Motivo y contexto *',name:'context',type:'textarea',full:true,req:true},{label:'Intervenciones',name:'interventions',type:'textarea',full:true},{label:'Evolución',name:'progress',type:'textarea',full:true},{label:'Plan y recomendaciones',name:'plan',type:'textarea',full:true},{label:'Pendientes / limitaciones',name:'limits',type:'textarea',full:true}],'Generar borrador');case'discharge':return formPage('Motor de alta · lista de verificación','El alta la decide el profesional responsable junto con la persona.',[{label:'Paciente / identificador',name:'patient'},{label:'Objetivos revisados',name:'goals',type:'check',placeholder:'Se revisaron objetivos y resultados.'},{label:'Necesidades y riesgos reevaluados',name:'risk',type:'check',placeholder:'Se revisaron necesidades, riesgos y protecciones.'},{label:'Plan de continuidad acordado',name:'continuity',type:'check',placeholder:'Existe plan de continuidad.'},{label:'Vías de ayuda explicadas',name:'warning',type:'check',placeholder:'Se explicaron señales de alerta y cómo pedir ayuda.'},{label:'Motivo y decisión profesional *',name:'decision',type:'textarea',full:true,req:true},{label:'Fecha propuesta',name:'date',type:'date'}],'Guardar evaluación','No se concede el alta automáticamente.');case'postdischarge':return formPage('Seguimiento post-alta','Planifica contactos y documenta continuidad.',[{label:'Paciente / identificador',name:'patient'},{label:'Fecha de "width:${S.patients.length?n/S.patients.length*100:0}%"></span></div><b>${n}</b></div>`}).join('')}</div>`;case'admin':return `<div class="welcome"><div><div class="eyebrow">Administración</div><h1 class="h1">Configuración de plataforma</h1></div></div><div class="notice ${S.fbReady?'blue':'red'}"><strong>Firebase:</strong> ${S.fbReady?'inicializado; revisa reglas y permisos.':'no configurado. No hay autenticación real ni persistencia clínica.'}</div><div class="grid cols"><div class="card"><h2>Estado técnico</h2>${[['Firebase Auth',S.fbReady],['Firestore',S.fbReady],['Storage',S.fbReady],['Proveedor de IA',false],['Videoconsulta',false]].map(([l,v])=>`<div class="bar-row"><span>${l}</span><span class="badge ${v?'green':'amber'}">${v?'Inicializado':'No conectado'}</span></div>`).join('')}</div><div class="card"><h2>Roles admitidos</h2><div class="pill-row" style="margin:12px 0">${['administrador','supervisor','psicologo','consejero','paciente'].map(x=>`<span class="pill">${x}</span>`).join('')}</div><p class="hint">Sin registro público ni autenticación anónima. Crea usuarios desde un entorno administrativo confiable y aplica reglas de Firestore/Storage.</p></div></div><div class="card" style="margin-top:15px"><h2>Configurar Firebase</h2><p class="sub">Añade el objeto de configuración web al principio del archivo, antes de este script. No incluyas secretos de servidor ni claves privadas.</p><pre style="white-space:pre-wrap;background:#f4f7f9;padding:12px;border-radius:8px;font-size:11px">window.PASTORALMENTE_FIREBASE_CONFIG = { apiKey: "API_KEY_WEB", authDomain: "proyecto.firebaseapp.com", projectId: "ID_PROYECTO", storageBucket: "proyecto.firebasestorage.app", messagingSenderId: "ID", appId: "APP_ID" };</pre></div>`;default:return `<div class="welcome"><div><div class="eyebrow">Módulo</div><h1 class="h1">${esc((MODULES.find(m=>m[0]===S.page)||MODULES[0])[1])}</h1></div></div>`}}
function auth(){return `<div class="auth-wrap"><div class="auth-card"><div class="auth-brand"><div class="logo">PM</div><div><strong>PastoralMente Enterprise</strong><div class="hint">Acompañamiento clínico-pastoral</div></div></div><h1>Iniciar sesión</h1><p>Acceso únicamente con una cuenta autorizada por el administrador.</p>${!S.fbReady?'<div class="notice">Firebase no está configurado. Añade la configuración web del proyecto y despliega reglas seguras. No hay acceso de demostración ni autenticación anónima.</div>':''}<form id="loginForm"><div class="field"><label>Correo electrónico</label><input name="email" type="email" required autocomplete="username"></div><div class="field" style="margin:12px 0"><label>Contraseña</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:8px" ${!S.fbReady?'disabled':''}>Iniciar sesión</button><button type="button" id="resetPassword" class="btn" style="width:100%;margin-top:8px" ${!S.fbReady?'disabled':''}>Recuperar contraseña</button><div id="authMsg" class="hint"></div></form><div class="footer-note">Sin registro público · No usar para emergencias.</div></div></div>`}
function render(){if(!S.user){$('#root').innerHTML=auth();$('#loginForm')?.addEventListener('submit',async e=>{e.preventDefault();if(!S.fbReady)return;let f=new FormData(e.currentTarget);try{await S.fb.signInWithEmailAndPassword(S.fb.auth,f.get('email'),f.get('password'))}catch(err){$('#authMsg').textContent='No fue posible iniciar sesión. Verifica credenciales o contacta al administrador.';console.error(err)}});$('#resetPassword')?.addEventListener('click',async()=>{let email=$('#loginForm').email.value;if(!email){$('#authMsg').textContent='Escribe tu correo primero.';return}try{await S.fb.sendPasswordResetEmail(S.fb.auth,email);$('#authMsg').textContent='Si la cuenta existe, recibirás instrucciones.'}catch(e){$('#authMsg').textContent='No se pudo iniciar recuperación.'}});return}$('#root').innerHTML=shell(content());$('#root').insertAdjacentHTML('afterbegin','<div style="position:relative;z-index:10;background:#fff4d8;color:#77531a;border-bottom:1px solid #ead59b;padding:9px 16px;font-size:12px;text-align:center"><strong>Acceso libre · Modo demostración.</strong> No introduzcas datos reales ni información identificable de pacientes; los registros no se guardan de forma segura ni persistente.</div>');document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{S.page=b.dataset.page;S.menu=false;log('navigation',S.page);render()}));$('#menuBtn')?.addEventListener('click',()=>{S.menu=!S.menu;$('#sidebar').classList.toggle('open',S.menu)});$('#logout')?.addEventListener('click',async()=>{if(S.fbReady)await S.fb.signOut(S.fb.auth);S.user=null;S.role='';S.page='dashboard';render()});$('#recordForm')?.addEventListener('submit',async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.currentTarget).entries()),kind=e.currentTarget.dataset.kind;if(kind==='admission'){if(!data.authorized){toast('Confirma la autorización antes de continuar.');return}if(!S.fbReady||!S.user){toast('Para guardar una admisión de forma persistente, configura Firebase e inicia sesión. No se guardó el expediente.');return}try{const doc=await S.fb.addDoc(S.fb.collection(S.fb.db,'patients'),{name:data.name,age:data.age?Number(data.age):null,contact:data.contact||'',reason:data.reason,priority:data.priority||'Pendiente de valoración',notes:data.notes||'',status:'Activo',stage:'Admisión',risk:'Pendiente de valoración',ownerUid:S.user.uid,createdAt:S.fb.serverTimestamp(),updatedAt:S.fb.serverTimestamp()});S.patients.unshift({id:doc.id,...data,status:'Activo',stage:'Admisión'});log('patient.created',doc.id);toast('Admisión guardada en Firestore.');S.page='dashboard';render();return}catch(err){console.error(err);toast('No se pudo guardar la admisión. Revisa reglas de Firestore.');return}}log('draft.created',kind);$('#result').innerHTML=`<div class="notice blue" style="margin-top:15px"><strong>Borrador creado.</strong> No se ha guardado en un expediente clínico. Este formulario solo prepara texto.</div><textarea readonly style="width:100%;min-height:150px;padding:10px;border:1px solid var(--line);border-radius:8px">${esc(Object.entries(data).map(([k,v])=>k+': '+v).join('\n'))}</textarea><button id="copy" class="btn small" style="margin-top:8px">Copiar borrador</button>`;$('#copy').onclick=()=>navigator.clipboard?.writeText(Object.entries(data).map(([k,v])=>k+': '+v).join('\n')).then(()=>toast('Borrador copiado.'))});$('#appointmentForm')?.addEventListener('submit',async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.currentTarget).entries());if(S.fbReady){try{await S.fb.addDoc(S.fb.collection(S.fb.db,'appointments'),{...o,createdBy:S.user.uid,createdAt:S.fb.serverTimestamp()});S.appointments.unshift(o);log('appointment.created','Cita guardada en Firestore');toast('Cita guardada.');render()}catch(err){toast('No se pudo guardar la cita; revisa reglas.')}}else{S.appointments.unshift(o);log('appointment.created.temporary','Solo memoria');toast('Cita temporal en memoria; configura Firebase.');render()}});document.querySelectorAll('.scaleForm').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();let vals=[...new FormData(f).values()].map(Number),score=vals.reduce((a,b)=>a+b,0),title=f.dataset.scale,phq=title==='PHQ-9',max=phq?27:21,level=phq?(score<=4?'mínima':score<=9?'leve':score<=14?'moderada':score<=19?'moderadamente grave':'grave'):(score<=4?'mínima':score<=9?'leve':score<=14?'moderada':'grave'),id=title.toLowerCase().replace('-',''),out=$('#result-'+id),item9=phq&&Number(new FormData(f).get('q9'))>0;out.innerHTML=`<div class="notice blue" style="margin-top:12px"><strong>${title}: ${score}/${max} · rango orientativo ${level}.</strong><p>No constituye diagnóstico. Interpretar con entrevista, contexto, funcionamiento y evolución.</p>${item9?'<div class="notice red"><strong>Revisión clínica prioritaria:</strong> el ítem 9 requiere evaluación directa de seguridad por un profesional. Ante peligro inmediato, buscar ayuda urgente.</div>':''}<button class="btn small" id="copyScale">Copiar resultado</button></div>`;$('#copyScale').onclick=()=>navigator.clipboard?.writeText(`${title}: ${score}/${max}, rango orientativo ${level}; no es diagnóstico.`).then(()=>toast('Resultado copiado.'));log('scale.scored',title+' calculado; no guardado automáticamente')}));$('#exportAudit')?.addEventListener('click',()=>{let rows=[['fecha','actor','accion','detalle'],...S.events.map(e=>[e.at,e.actor,e.action,e.detail])],csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='pastoralmente-auditoria-sesion.csv';a.click();URL.revokeObjectURL(a.href)})}
